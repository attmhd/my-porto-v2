<!doctype html>
<html lang="en" class="scroll-smooth notranslate" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>%PORTFOLIO_TITLE%</title>
        <meta
            name="description"
            content="%PORTFOLIO_DESCRIPTION%"
        />
        <meta
            name="keywords"
            content="%PORTFOLIO_KEYWORDS%"
        />
        <meta name="author" content="%PORTFOLIO_NAME%" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="%PORTFOLIO_SITE_URL%" />

        <!-- Open Graph / Facebook, LinkedIn, Instagram -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="%PORTFOLIO_SITE_URL%" />
        <meta property="og:site_name" content="%PORTFOLIO_NAME%" />
        <meta property="og:locale" content="%PORTFOLIO_LOCALE%" />
        <meta
            property="og:title"
            content="%PORTFOLIO_TITLE%"
        />
        <meta
            property="og:description"
            content="%PORTFOLIO_SOCIAL_DESCRIPTION%"
        />
        <meta property="og:image" content="%PORTFOLIO_IMAGE_URL%" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="%PORTFOLIO_SITE_URL%" />
        <meta
            property="twitter:title"
            content="%PORTFOLIO_TITLE%"
        />
        <meta
            property="twitter:description"
            content="%PORTFOLIO_SOCIAL_DESCRIPTION%"
        />
        <meta
            property="twitter:image"
            content="%PORTFOLIO_IMAGE_URL%"
        />

        <meta
            name="google-site-verification"
            content="jFNNqgE9jf_DuHd-bOUenFsew7ugcDAzAEf5gRDmnWg"
        />

        <link rel="icon" type="image/png" href="%PORTFOLIO_IMAGE_PATH%" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Plus Jakarta Sans", "sans-serif"],
                            display: ["Plus Jakarta Sans", "sans-serif"],
                        },
                        colors: {
                            background: {
                                DEFAULT: "#f8fafc", // Slate 50 for light mode
                                dark: "#0a0a0a", // Original dark mode
                            },
                            surface: {
                                DEFAULT: "#ffffff", // White for light mode
                                dark: "#121212", // Original dark mode
                            },
                            primary: "#3b82f6", // Blue 500
                            secondary: "#8b5cf6", // Violet 500
                            accent: "#06b6d4", // Cyan 500
                            // Add specific text colors for better control if needed,
                            // but we will mostly use standard tailwind text- colors
                        },
                        animation: {
                            blob: "blob 7s infinite",
                            marquee: "marquee 30s linear infinite",
                            "marquee-reverse":
                                "marquee-reverse 30s linear infinite",
                            "fade-in": "fadeIn 0.5s ease-in-out forwards",
                            "fade-out": "fadeOut 0.5s ease-in-out forwards",
                        },
                        keyframes: {
                            fadeIn: {
                                "0%": {
                                    opacity: "0",
                                    transform: "translateY(8px)",
                                },
                                "100%": {
                                    opacity: "1",
                                    transform: "translateY(0)",
                                },
                            },
                            fadeOut: {
                                "0%": {
                                    opacity: "1",
                                    transform: "translateY(0)",
                                },
                                "100%": {
                                    opacity: "0",
                                    transform: "translateY(-8px)",
                                },
                            },
                            marquee: {
                                "0%": { transform: "translateX(0%)" },
                                "100%": { transform: "translateX(-50%)" },
                            },
                            "marquee-reverse": {
                                "0%": { transform: "translateX(-50%)" },
                                "100%": { transform: "translateX(0%)" },
                            },
                            blob: {
                                "0%": {
                                    transform: "translate(0px, 0px) scale(1)",
                                },
                                "33%": {
                                    transform:
                                        "translate(30px, -50px) scale(1.1)",
                                },
                                "66%": {
                                    transform:
                                        "translate(-20px, 20px) scale(0.9)",
                                },
                                "100%": {
                                    transform: "translate(0px, 0px) scale(1)",
                                },
                            },
                        },
                    },
                },
            };
        </script>
        <style>
            /* Custom Scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #0a0a0a;
            }

            ::-webkit-scrollbar-thumb {
                background: #333;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #555;
            }

        </style>

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">%PORTFOLIO_STRUCTURED_DATA%</script>
    </head>

    <body
        translate="no"
        class="bg-background text-gray-900 dark:bg-background-dark dark:text-gray-100 transition-colors duration-300"
    >
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
